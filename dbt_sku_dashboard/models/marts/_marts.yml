version: 2
models:
  - name: fct_sku_channel
    description: SKU x channel grain. Sales, avg fee, avg shipping per channel.
    columns:
      - name: sku_channel
        tests: [not_null, unique]
  - name: fct_sku_profit
    columns:
      - name: sku
        tests: [not_null, unique]
  - name: fct_sku_profit_monthly
    columns:
      - name: sku_month
        tests: [not_null, unique]
  - name: fct_order_item_profit
    columns:
      - name: order_item_id
        tests: [not_null, unique]
